<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Price Calculator | คำนวณราคาสินค้า</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Prompt:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <header>
            <h1>Price Calculator</h1>
            <p>คำนวณราคาบวกเพิ่มสำหรับแพลตฟอร์มต่างๆ</p>
        </header>

        <main>
            <!-- Section 1: Platform Selection -->
            <section class="card section-platform">
                <h2>1. เลือกแพลตฟอร์ม (Platform)</h2>
                <div class="input-group">
                    <label for="platformSelect">แพลตฟอร์ม</label>
                    <select id="platformSelect">
                        <option value="shopee">Shopee (Base +7.49%)</option>
                        <option value="lazada">Lazada (Base +1.07%)</option>
                        <option value="tiktok">Tiktok (Base +3.21%)</option>
                    </select>
                </div>
            </section>

            <!-- Section 2: DIY Link -->
            <section class="card section-diy">
                <h2>2. โหลดจัดสเปกคอม (DIY Link)</h2>
                <div class="input-group diy-group" style="display: flex; gap: 10px; align-items: flex-end;">
                    <div style="flex: 1;">
                        <label for="diyUrl">ลิงก์ iHAVECPU DIY (เช่น ihavecpu.com/diy/share/...)</label>
                        <input type="text" id="diyUrl" placeholder="วางลิงก์ที่นี่...">
                    </div>
                    <button id="fetchDiyBtn" class="btn btn-primary" style="white-space: nowrap;">ดึงราคา</button>
                </div>
                <div id="diyResult" style="margin-top: 10px; font-size: 0.9em; color: #555;"></div>
            </section>

            <!-- Section 3: Items Details -->
            <section class="card section-items">
                <div class="section-header">
                    <h2>3. รายละเอียดสินค้า</h2>
                    <button id="addItemBtn" class="btn btn-primary">+ เพิ่มสินค้า</button>
                </div>
                <div id="itemsContainer">
                    <!-- Item rows will be dynamically injected here -->
                </div>
            </section>

            <!-- Section 4: Summary -->
            <section class="card section-summary">
                <h2>4. สรุปผล (คลิกเพื่อ Copy)</h2>
                <div class="summary-box" id="summaryBox">
                    <div id="summaryContent" class="summary-content">
                        <!-- Summary text goes here -->
                    </div>
                    <div class="copy-hint">คลิก 1 ครั้งเพื่อ Copy ข้อความ</div>
                </div>
            </section>
        </main>
    </div>

    <!-- Template for item row -->
    <template id="itemRowTemplate">
        <div class="item-row">
            <div class="item-inputs">
                <div class="input-group">
                    <label>ชื่อสินค้า</label>
                    <div class="autocomplete-wrapper" style="position: relative;">
                        <input type="text" class="item-name" placeholder="พิมพ์ชื่อสินค้าเพื่อค้นหาจาก ihavecpu...">
                        <ul class="autocomplete-dropdown hidden"></ul>
                    </div>
                </div>
                <div class="input-group">
                    <label>หมวดหมู่ (อิงตามแพลตฟอร์ม)</label>
                    <select class="item-category">
                        <!-- Options generated by JS -->
                    </select>
                </div>
                <div class="input-group">
                    <label>ราคาต้นทุน (บาท)</label>
                    <input type="number" class="item-price" min="0" step="0.01" placeholder="0">
                </div>
            </div>
            <div class="item-actions">
                <button class="btn btn-icon btn-remove" title="ลบสินค้านี้">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"></path><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"></path><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"></path></svg>
                </button>
            </div>
            <div class="item-result">
                ราคาขาย: <span class="calculated-price">0.00</span> บาท
            </div>
        </div>
    </template>

    <div id="toast" class="toast">คัดลอกข้อความแล้ว!</div>

    <script src="script.js"></script>
</body>
</html>
